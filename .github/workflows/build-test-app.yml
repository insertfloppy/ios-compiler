# Builds a small test app (IosccTest) that links libioscc.a + LLVM and, when you tap a button,
# compiles and links a C file on the device, then runs it with ioscc's JIT if JIT is on. Uses the toolchain artifact from a finished
# build-ios-compiler run, so the 2-3 hour LLVM build is NOT repeated.
#
# Put this file in your fork at .github/workflows/build-test-app.yml, then Actions >
# build-test-app > Run workflow. Leave "run_id" blank to use the latest successful
# build-ios-compiler run. Download the IosccTest-ipa artifact and sideload it.
#
# The app sources were compile-checked with clang 21.1.8 against the iOS 26.5 SDK, and test-linked
# with a stub in place of libioscc.a. The full build with the real libraries has NOT been run yet.

name: build-test-app

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a successful build-ios-compiler or rebuild-ioscc run (blank = newest of either)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  IPAB_HOME: ${{ github.workspace }}/ios-compiler-for-linux
  SWIFTVER: "6.4.1"

jobs:
  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Find the toolchain run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.run_id }}
        run: |
          id="$INPUT_RUN"
          if [ -z "$id" ]; then
            # Newest successful run of either workflow that produces ios-compiler-out.
            full=$(gh run list --workflow build-ios-compiler.yml --status success --limit 1 --json databaseId,createdAt 2>/dev/null || echo '[]')
            quick=$(gh run list --workflow rebuild-ioscc.yml --status success --limit 1 --json databaseId,createdAt 2>/dev/null || echo '[]')
            id=$(printf '%s\n%s\n' "$full" "$quick" | jq -s 'add | sort_by(.createdAt) | last | .databaseId')
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "No successful toolchain run found"; exit 1; fi
          echo "Using run $id"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - name: Download the toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-compiler-out
          path: art
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Show what was downloaded
        run: |
          find art -maxdepth 3 | head -40
          du -sh art
          find art -name libioscc.a

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip curl git pkg-config libplist-dev libssl-dev xz-utils wget gnupg lsb-release software-properties-common

      - name: Install clang 21 (the iOS 26.5 SDK needs a recent clang; clang 18 fails on its headers)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-21 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/lld-21 /usr/bin/lld
          clang --version

      - name: Get ipab and run its setup
        run: |
          git clone --depth 1 https://github.com/mezyqq/ios-compiler-for-linux.git "$IPAB_HOME"
          cd "$IPAB_HOME" && ./setup.sh

      - name: Assemble the IosccTest project
        run: |
          P="$IPAB_HOME/IosccTest"
          mkdir -p "$P/src" "$P/lib/llvm"
          LIB=$(find art -name libioscc.a | head -1)
          [ -n "$LIB" ] || { echo "libioscc.a not found in the artifact"; exit 1; }
          OUTDIR=$(dirname "$LIB")
          cp "$LIB" "$P/lib/"
          [ -d "$OUTDIR/toolchain" ] || { echo "toolchain dir not found next to libioscc.a"; exit 1; }
          cp -a "$OUTDIR/toolchain" "$P/toolchain"
          # Shown at the top of the app's log, so we can tell which libioscc.a the installed app has.
          {
            echo "toolchain run: ${{ steps.find.outputs.run_id }}"
            echo "test-app run: ${{ github.run_id }}"
            echo "libioscc.a sha256: $(sha256sum "$LIB" | cut -c1-16)"
            if grep -q setUpInactivePlatform "$LIB"; then echo "jit platform: inactive"; else echo "jit platform: default (old libioscc.a)"; fi
          } > "$P/toolchain/BUILD_INFO"
          cat "$P/toolchain/BUILD_INFO"
          find art -path '*llvm-ios-build/lib/*.a' -exec cp {} "$P/lib/llvm/" \;
          ls "$P/lib/llvm" | wc -l
          cp ioscc.h "$P/src/ioscc.h"
          cat > "$P/src/ioscc_test.h" <<'EOF'
          // Glue between the UIKit side (main.m, plain Objective-C) and the clang/lld side (runner.m).
          #ifndef IOSCC_TEST_H
          #define IOSCC_TEST_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          typedef void (*IosccLogFn)(const char *line);
          void ioscc_run_test(IosccLogFn log);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
          cat > "$P/src/runner.m" <<'EOF'
          // Runs clang + lld in-process (libioscc.a). Plain Objective-C on purpose: with the iOS 26.5 SDK
          // and clang 21, both the UIKit and Foundation modules fail to build in Objective-C++ mode.
          // The C++ runtime that libioscc.a needs comes from LIBS="c++" in ipa.conf.
          #import <Foundation/Foundation.h>
          #include <fcntl.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include "ioscc.h"
          #include "ioscc_test.h"

          static IosccLogFn gLogFn;

          static void logf_(NSString *fmt, ...) {
          	va_list ap; va_start(ap, fmt);
          	NSString *s = [[NSString alloc] initWithFormat:fmt arguments:ap];
          	va_end(ap);
          	if (gLogFn) gLogFn(s.UTF8String);
          }

          // Run fn with one file descriptor (2 = stderr, 1 = stdout) redirected to a file and return what
          // was written. clang and lld print diagnostics on stderr; the JIT-run program prints on stdout.
          static NSString *captureFd(int target, int (^fn)(void), int *rc) {
          	NSString *p = [NSTemporaryDirectory() stringByAppendingPathComponent:
          		[NSString stringWithFormat:@"ioscc-fd%d.txt", target]];
          	fflush(stdout); fflush(stderr);
          	int saved = dup(target);
          	int fd = open(p.fileSystemRepresentation, O_WRONLY | O_CREAT | O_TRUNC, 0644);
          	dup2(fd, target);
          	close(fd);
          	*rc = fn();
          	fflush(stdout); fflush(stderr);
          	dup2(saved, target);
          	close(saved);
          	return [NSString stringWithContentsOfFile:p encoding:NSUTF8StringEncoding error:nil] ?: @"";
          }

          // Call an argc/argv entry point with an array of strings.
          static int callArgv(int (*f)(int, const char **), NSArray<NSString *> *args) {
          	int n = (int)args.count;
          	const char **v = calloc((size_t)n + 1, sizeof(char *));
          	for (int i = 0; i < n; i++) v[i] = strdup(args[(NSUInteger)i].UTF8String);
          	int rc = f(n, v);
          	for (int i = 0; i < n; i++) free((void *)v[i]);
          	free(v);
          	return rc;
          }

          static void listTree(NSString *root, int depth, NSString *indent, int *budget) {
          	NSFileManager *fm = NSFileManager.defaultManager;
          	NSArray *items = [[fm contentsOfDirectoryAtPath:root error:nil] sortedArrayUsingSelector:@selector(compare:)];
          	for (NSString *n in items) {
          		if ((*budget)-- <= 0) return;
          		NSString *full = [root stringByAppendingPathComponent:n];
          		BOOL isDir = NO;
          		[fm fileExistsAtPath:full isDirectory:&isDir];
          		logf_(@"%@%@%@", indent, n, isDir ? @"/" : @"");
          		if (isDir && depth > 1) listTree(full, depth - 1, [indent stringByAppendingString:@"  "], budget);
          	}
          }

          static NSString *findSysroot(NSString *dir, int depth) {
          	NSFileManager *fm = NSFileManager.defaultManager;
          	if ([fm fileExistsAtPath:[dir stringByAppendingPathComponent:@"usr/include/stdio.h"]]) return dir;
          	if (depth == 0) return nil;
          	for (NSString *n in [fm contentsOfDirectoryAtPath:dir error:nil]) {
          		NSString *full = [dir stringByAppendingPathComponent:n];
          		BOOL isDir = NO;
          		if ([fm fileExistsAtPath:full isDirectory:&isDir] && isDir) {
          			NSString *r = findSysroot(full, depth - 1);
          			if (r) return r;
          		}
          	}
          	return nil;
          }

          void ioscc_run_test(IosccLogFn log) {
          	gLogFn = log;
          	NSFileManager *fm = NSFileManager.defaultManager;
          	logf_(@"=== ioscc test ===");
          	logf_(@"ioscc_version: %s", ioscc_version());
          	NSString *info = [NSString stringWithContentsOfFile:[NSBundle.mainBundle.bundlePath
          		stringByAppendingPathComponent:@"toolchain/BUILD_INFO"] encoding:NSUTF8StringEncoding error:nil];
          	logf_(@"%@", info ?: @"(no BUILD_INFO)");
          	NSString *tc = [NSBundle.mainBundle.bundlePath stringByAppendingPathComponent:@"toolchain"];
          	logf_(@"toolchain dir: %@ (exists=%d)", tc, (int)[fm fileExistsAtPath:tc]);
          	int budget = 60;
          	listTree(tc, 2, @"  ", &budget);
          	NSString *sysroot = findSysroot(tc, 3);
          	logf_(@"sysroot: %@", sysroot ?: @"(NOT FOUND)");
          	NSString *clangBin = [tc stringByAppendingPathComponent:@"bin/clang"];
          	NSString *resRoot = [tc stringByAppendingPathComponent:@"lib/clang"];
          	logf_(@"clang resource versions: %@", [fm contentsOfDirectoryAtPath:resRoot error:nil] ?: @[]);
          	if (!sysroot) { logf_(@"STOP: no sysroot found. Send me this log."); return; }

          	NSString *work = [NSTemporaryDirectory() stringByAppendingPathComponent:@"ioscc-test"];
          	[fm removeItemAtPath:work error:nil];
          	[fm createDirectoryAtPath:work withIntermediateDirectories:YES attributes:nil error:nil];
          	NSString *src = [work stringByAppendingPathComponent:@"hello.c"];
          	NSString *obj = [work stringByAppendingPathComponent:@"hello.o"];
          	NSString *out = [work stringByAppendingPathComponent:@"hello"];
          	[@"#include <stdio.h>\nint main(void) { printf(\"hello from on-device clang\\n\"); return 0; }\n"
          		writeToFile:src atomically:YES encoding:NSUTF8StringEncoding error:nil];

          	int rc = -1;
          	NSArray *cc = @[ clangBin, @"-c", @"-target", @"arm64-apple-ios15.0",
          		@"-isysroot", sysroot, @"-O0", src, @"-o", obj ];
          	NSString *e1 = captureFd(STDERR_FILENO, ^int { return callArgv(ioscc_cc, cc); }, &rc);
          	logf_(@"compile rc=%d  object exists=%d", rc, (int)[fm fileExistsAtPath:obj]);
          	if (e1.length) logf_(@"compile stderr:\n%@", e1);
          	if (rc != 0) { logf_(@"STOP: compile failed."); return; }

          	NSArray *ld = @[ @"ld64.lld", @"-arch", @"arm64", @"-platform_version", @"ios", @"15.0", @"26.5",
          		@"-syslibroot", sysroot, @"-adhoc_codesign", @"-lSystem", @"-o", out, obj ];
          	NSString *e2 = captureFd(STDERR_FILENO, ^int { return callArgv(ioscc_ld, ld); }, &rc);
          	logf_(@"link rc=%d  output exists=%d", rc, (int)[fm fileExistsAtPath:out]);
          	if (e2.length) logf_(@"link stderr:\n%@", e2);
          	if (rc != 0) { logf_(@"STOP: link failed."); return; }

          	NSData *d = [NSData dataWithContentsOfFile:out];
          	const unsigned char *b = (const unsigned char *)d.bytes;
          	logf_(@"output size: %lu bytes", (unsigned long)d.length);
          	if (d.length >= 4) logf_(@"first bytes: %02x %02x %02x %02x (a 64-bit Mach-O starts cf fa ed fe)", b[0], b[1], b[2], b[3]);
          	logf_(@"=== PASS: compiled and linked on device ===");

          	// Step 3: run hello.o inside this app with ioscc's JIT. Needs JIT on (the app must be under a
          	// debugger, e.g. enabled with StikDebug). Without JIT this step is skipped, not failed.
          	if (!ioscc_jit_enabled()) {
          		logf_(@"JIT is off, so the run step is skipped. Enable JIT for IosccTest (for example with StikDebug), then tap Run again.");
          		return;
          	}
          	// TXM devices (iOS 26+, A17 Pro/M4 and newer) need StikDebug's universal.js script to prepare
          	// executable memory. Without the script this fails cleanly and the plain JIT path is used.
          	__block int prep = -1;
          	NSString *ep = captureFd(STDERR_FILENO, ^int { prep = ioscc_jit_prepare(16 << 20); return prep; }, &rc);
          	logf_(@"ioscc_jit_prepare: %d%@", prep, prep == 0 ? @" (executable memory ready)" : @"");
          	if (ep.length) logf_(@"prepare stderr:\n%@", ep);
          	if (prep != 0) logf_(@"Continuing without it. On an iPad with M4 or an iPhone 15 Pro or newer, tap \"Enable JIT\" in this app instead of enabling JIT from StikDebug directly.");
          	logf_(@"JIT is on: loading hello.o");
          	__block ioscc_jit *jit = NULL;
          	NSString *e3 = captureFd(STDERR_FILENO, ^int {
          		const char *objs[] = { obj.UTF8String };
          		jit = ioscc_jit_load(1, objs);
          		return jit ? 0 : 1;
          	}, &rc);
          	if (e3.length) logf_(@"jit load stderr:\n%@", e3);
          	if (!jit) { logf_(@"STOP: JIT load failed."); return; }
          	NSString *printed = captureFd(STDOUT_FILENO, ^int {
          		const char *args[] = { "hello" };
          		return ioscc_jit_main(jit, 1, args);
          	}, &rc);
          	logf_(@"program exit code: %d%@", rc, rc > 128 ? [NSString stringWithFormat:@" (crashed: %s)", strsignal(rc - 128)] : @"");
          	logf_(@"program output: %@", printed.length ? printed : @"(nothing)");
          	if (rc == 0 && [printed containsString:@"hello from on-device clang"])
          		logf_(@"=== PASS: compiled, linked and RAN on device ===");
          }
          EOF
          cat > "$P/src/main.m" <<'EOF'
          // IosccTest UI (plain Objective-C). Tap "Run compile test"; "Copy log" copies the log.
          #import <UIKit/UIKit.h>
          #include <unistd.h>
          #include "ioscc_test.h"

          static NSMutableString *gLog;
          static UITextView *gView;

          static void logLine(const char *line) {
          	NSString *s = [NSString stringWithUTF8String:line ?: ""];
          	dispatch_async(dispatch_get_main_queue(), ^{
          		[gLog appendFormat:@"%@\n", s];
          		gView.text = gLog;
          		[gView scrollRangeToVisible:NSMakeRange(gLog.length, 0)];
          	});
          }

          @interface VC : UIViewController
          @end
          @implementation VC
          - (void)viewDidLoad {
          	[super viewDidLoad];
          	self.view.backgroundColor = UIColor.systemBackgroundColor;
          	UIButton *run = [UIButton buttonWithType:UIButtonTypeSystem];
          	[run setTitle:@"Run compile test" forState:UIControlStateNormal];
          	[run addTarget:self action:@selector(run) forControlEvents:UIControlEventTouchUpInside];
          	UIButton *copy = [UIButton buttonWithType:UIButtonTypeSystem];
          	[copy setTitle:@"Copy log" forState:UIControlStateNormal];
          	[copy addTarget:self action:@selector(copyLog) forControlEvents:UIControlEventTouchUpInside];
          	UIButton *jit = [UIButton buttonWithType:UIButtonTypeSystem];
          	[jit setTitle:@"Enable JIT" forState:UIControlStateNormal];
          	[jit addTarget:self action:@selector(enableJIT) forControlEvents:UIControlEventTouchUpInside];
          	UIStackView *bar = [[UIStackView alloc] initWithArrangedSubviews:@[ jit, run, copy ]];
          	bar.distribution = UIStackViewDistributionFillEqually;
          	gLog = [NSMutableString new];
          	gView = [UITextView new];
          	gView.editable = NO;
          	gView.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
          	bar.translatesAutoresizingMaskIntoConstraints = NO;
          	gView.translatesAutoresizingMaskIntoConstraints = NO;
          	[self.view addSubview:bar];
          	[self.view addSubview:gView];
          	UILayoutGuide *g = self.view.safeAreaLayoutGuide;
          	[NSLayoutConstraint activateConstraints:@[
          		[bar.topAnchor constraintEqualToAnchor:g.topAnchor],
          		[bar.leadingAnchor constraintEqualToAnchor:g.leadingAnchor],
          		[bar.trailingAnchor constraintEqualToAnchor:g.trailingAnchor],
          		[bar.heightAnchor constraintEqualToConstant:44],
          		[gView.topAnchor constraintEqualToAnchor:bar.bottomAnchor],
          		[gView.leadingAnchor constraintEqualToAnchor:g.leadingAnchor],
          		[gView.trailingAnchor constraintEqualToAnchor:g.trailingAnchor],
          		[gView.bottomAnchor constraintEqualToAnchor:g.bottomAnchor] ]];
          }
          - (void)run {
          	NSThread *t = [[NSThread alloc] initWithBlock:^{ ioscc_run_test(logLine); }];
          	t.stackSize = 8 * 1024 * 1024;  // clang is recursive; ioscc.h asks for 8 MB
          	[t start];
          }
          // Asks StikDebug to attach with universal.js, which prepares JIT memory on TXM devices.
          - (void)enableJIT {
          	NSURLComponents *c = [NSURLComponents componentsWithString:@"stikdebug://enable-jit"];
          	c.queryItems = @[
          		[NSURLQueryItem queryItemWithName:@"bundle-id" value:NSBundle.mainBundle.bundleIdentifier],
          		[NSURLQueryItem queryItemWithName:@"pid" value:[NSString stringWithFormat:@"%d", getpid()]],
          		[NSURLQueryItem queryItemWithName:@"script-name" value:@"universal.js"] ];
          	logLine([NSString stringWithFormat:@"Opening %@", c.URL.absoluteString].UTF8String);
          	[UIApplication.sharedApplication openURL:c.URL options:@{} completionHandler:^(BOOL ok) {
          		if (!ok) logLine("Could not open StikDebug. Is it installed?");
          	}];
          }
          - (void)copyLog { UIPasteboard.generalPasteboard.string = gLog ?: @""; }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
          	self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
          	self.window.rootViewController = [VC new];
          	[self.window makeKeyAndVisible];
          	return YES;
          }
          @end

          int main(int argc, char *argv[]) {
          	@autoreleasepool {
          		return UIApplicationMain(argc, argv, nil, NSStringFromClass(AppDelegate.class));
          	}
          }
          EOF
          cat > "$P/ipa.conf" <<'EOF'
          NAME="IosccTest"
          BUNDLE_ID="com.example.iosccpest"
          VERSION="1.0"
          BUILD="1"
          MIN_IOS="15.0"
          FRAMEWORKS="Foundation UIKit"
          LIBS="c++ z"
          CFLAGS=""
          SWIFTFLAGS=""
          # libioscc.a plus every LLVM static library; Mach-O linking does not depend on archive order.
          LDFLAGS="-Wl,-dead_strip $PROJ/lib/libioscc.a $(ls "$PROJ"/lib/llvm/*.a | tr '\n' ' ')"
          ICON=""
          EXTRA_RES="toolchain"
          EOF
          ls -la "$P" "$P/src"

      - name: Build the test app
        working-directory: ${{ env.IPAB_HOME }}
        run: |
          ./ipab build IosccTest
          ls -lh IosccTest/build/

      - uses: actions/upload-artifact@v4
        with:
          name: IosccTest-ipa
          path: ${{ env.IPAB_HOME }}/IosccTest/build/IosccTest.ipa
          if-no-files-found: error
