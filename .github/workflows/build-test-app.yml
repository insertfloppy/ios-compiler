# Builds a small test app (IosccTest) that links libioscc.a + LLVM and, when you tap a button,
# compiles and links a C file on the device. Uses the toolchain artifact from a finished
# build-ios-compiler run, so the 2-3 hour LLVM build is NOT repeated.
#
# Put this file in your fork at .github/workflows/build-test-app.yml, then Actions >
# build-test-app > Run workflow. Leave "run_id" blank to use the latest successful
# build-ios-compiler run. Download the IosccTest-ipa artifact and sideload it.
#
# NOT YET RUN. Things marked CHECK are guesses.

name: build-test-app

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a successful build-ios-compiler run (blank = latest successful)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  IPAB_HOME: ${{ github.workspace }}/ios-compiler-for-linux
  SWIFTVER: "6.4.1"

jobs:
  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Find the toolchain run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.run_id }}
        run: |
          id="$INPUT_RUN"
          if [ -z "$id" ]; then
            id=$(gh run list --workflow build-ios-compiler.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then echo "No successful build-ios-compiler run found"; exit 1; fi
          echo "Using run $id"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - name: Download the toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-compiler-out
          path: art
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Show what was downloaded
        run: |
          find art -maxdepth 3 | head -40
          du -sh art
          find art -name libioscc.a

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip curl git pkg-config libplist-dev libssl-dev xz-utils wget gnupg lsb-release software-properties-common

      - name: Install clang 21 (the app is ObjC++, and the iOS 26.5 SDK's libc++ needs clang 19+)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-21 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/lld-21 /usr/bin/lld
          clang --version

      - name: Get ipab and run its setup
        run: |
          git clone --depth 1 https://github.com/mezyqq/ios-compiler-for-linux.git "$IPAB_HOME"
          cd "$IPAB_HOME" && ./setup.sh

      - name: Assemble the IosccTest project
        run: |
          P="$IPAB_HOME/IosccTest"
          mkdir -p "$P/src" "$P/lib/llvm"
          LIB=$(find art -name libioscc.a | head -1)
          [ -n "$LIB" ] || { echo "libioscc.a not found in the artifact"; exit 1; }
          OUTDIR=$(dirname "$LIB")
          cp "$LIB" "$P/lib/"
          [ -d "$OUTDIR/toolchain" ] || { echo "toolchain dir not found next to libioscc.a"; exit 1; }
          cp -a "$OUTDIR/toolchain" "$P/toolchain"
          find art -path '*llvm-ios-build/lib/*.a' -exec cp {} "$P/lib/llvm/" \;
          ls "$P/lib/llvm" | wc -l
          cp ioscc.h "$P/src/ioscc.h"
          cat > "$P/src/main.mm" <<'EOF'
          // IosccTest: proves clang + lld (libioscc.a) run inside an iOS app, with no fork/exec.
          // Tap "Run compile test": it compiles a hello.c to an object file, links it to a Mach-O,
          // and prints everything it sees. "Copy log" puts the log on the clipboard.
          #import <UIKit/UIKit.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <string>
          #include <vector>
          extern "C" {
          #include "ioscc.h"
          }

          static NSMutableString *gLog;
          static UITextView *gView;

          static void logf_(NSString *fmt, ...) {
          	va_list ap; va_start(ap, fmt);
          	NSString *s = [[NSString alloc] initWithFormat:fmt arguments:ap];
          	va_end(ap);
          	dispatch_async(dispatch_get_main_queue(), ^{
          		[gLog appendFormat:@"%@\n", s];
          		gView.text = gLog;
          		[gView scrollRangeToVisible:NSMakeRange(gLog.length, 0)];
          	});
          }

          // Run fn with stderr (fd 2) redirected to a file, because clang and lld print diagnostics there.
          static NSString *captureStderr(int (^fn)(void), int *rc) {
          	NSString *p = [NSTemporaryDirectory() stringByAppendingPathComponent:@"ioscc-stderr.txt"];
          	fflush(stderr);
          	int saved = dup(STDERR_FILENO);
          	int fd = open(p.fileSystemRepresentation, O_WRONLY | O_CREAT | O_TRUNC, 0644);
          	dup2(fd, STDERR_FILENO);
          	close(fd);
          	*rc = fn();
          	fflush(stderr);
          	dup2(saved, STDERR_FILENO);
          	close(saved);
          	return [NSString stringWithContentsOfFile:p encoding:NSUTF8StringEncoding error:nil] ?: @"";
          }

          static int callArgv(int (*f)(int, const char **), const std::vector<std::string> &a) {
          	std::vector<const char *> v;
          	for (const auto &s : a) v.push_back(s.c_str());
          	v.push_back(nullptr);
          	return f((int)a.size(), v.data());
          }

          static void listTree(NSString *root, int depth, NSString *indent, int *budget) {
          	NSFileManager *fm = NSFileManager.defaultManager;
          	NSArray *items = [[fm contentsOfDirectoryAtPath:root error:nil] sortedArrayUsingSelector:@selector(compare:)];
          	for (NSString *n in items) {
          		if ((*budget)-- <= 0) return;
          		NSString *full = [root stringByAppendingPathComponent:n];
          		BOOL isDir = NO;
          		[fm fileExistsAtPath:full isDirectory:&isDir];
          		logf_(@"%@%@%@", indent, n, isDir ? @"/" : @"");
          		if (isDir && depth > 1) listTree(full, depth - 1, [indent stringByAppendingString:@"  "], budget);
          	}
          }

          static NSString *findSysroot(NSString *dir, int depth) {
          	NSFileManager *fm = NSFileManager.defaultManager;
          	if ([fm fileExistsAtPath:[dir stringByAppendingPathComponent:@"usr/include/stdio.h"]]) return dir;
          	if (depth == 0) return nil;
          	for (NSString *n in [fm contentsOfDirectoryAtPath:dir error:nil]) {
          		NSString *full = [dir stringByAppendingPathComponent:n];
          		BOOL isDir = NO;
          		if ([fm fileExistsAtPath:full isDirectory:&isDir] && isDir) {
          			NSString *r = findSysroot(full, depth - 1);
          			if (r) return r;
          		}
          	}
          	return nil;
          }

          static void runTest(void) {
          	NSFileManager *fm = NSFileManager.defaultManager;
          	logf_(@"=== ioscc test ===");
          	logf_(@"ioscc_version: %s", ioscc_version());
          	NSString *tc = [NSBundle.mainBundle.bundlePath stringByAppendingPathComponent:@"toolchain"];
          	logf_(@"toolchain dir: %@ (exists=%d)", tc, (int)[fm fileExistsAtPath:tc]);
          	int budget = 60;
          	listTree(tc, 2, @"  ", &budget);
          	NSString *sysroot = findSysroot(tc, 3);
          	logf_(@"sysroot: %@", sysroot ?: @"(NOT FOUND)");
          	NSString *clangBin = [tc stringByAppendingPathComponent:@"bin/clang"];
          	NSString *resRoot = [tc stringByAppendingPathComponent:@"lib/clang"];
          	logf_(@"clang resource versions: %@", [fm contentsOfDirectoryAtPath:resRoot error:nil] ?: @[]);
          	if (!sysroot) { logf_(@"STOP: no sysroot found. Send me this log."); return; }

          	NSString *work = [NSTemporaryDirectory() stringByAppendingPathComponent:@"ioscc-test"];
          	[fm removeItemAtPath:work error:nil];
          	[fm createDirectoryAtPath:work withIntermediateDirectories:YES attributes:nil error:nil];
          	NSString *src = [work stringByAppendingPathComponent:@"hello.c"];
          	NSString *obj = [work stringByAppendingPathComponent:@"hello.o"];
          	NSString *out = [work stringByAppendingPathComponent:@"hello"];
          	[@"#include <stdio.h>\nint main(void) { printf(\"hello from on-device clang\\n\"); return 0; }\n"
          		writeToFile:src atomically:YES encoding:NSUTF8StringEncoding error:nil];

          	int rc = -1;
          	std::vector<std::string> cc = {
          		clangBin.UTF8String, "-c", "-target", "arm64-apple-ios15.0",
          		"-isysroot", sysroot.UTF8String, "-O0", src.UTF8String, "-o", obj.UTF8String };
          	NSString *e1 = captureStderr(^int { return callArgv(ioscc_cc, cc); }, &rc);
          	logf_(@"compile rc=%d  object exists=%d", rc, (int)[fm fileExistsAtPath:obj]);
          	if (e1.length) logf_(@"compile stderr:\n%@", e1);
          	if (rc != 0) { logf_(@"STOP: compile failed."); return; }

          	std::vector<std::string> ld = {
          		"ld64.lld", "-arch", "arm64", "-platform_version", "ios", "15.0", "15.0",
          		"-syslibroot", sysroot.UTF8String, "-lSystem", "-o", out.UTF8String, obj.UTF8String };
          	NSString *e2 = captureStderr(^int { return callArgv(ioscc_ld, ld); }, &rc);
          	logf_(@"link rc=%d  output exists=%d", rc, (int)[fm fileExistsAtPath:out]);
          	if (e2.length) logf_(@"link stderr:\n%@", e2);
          	if (rc != 0) { logf_(@"STOP: link failed."); return; }

          	NSData *d = [NSData dataWithContentsOfFile:out];
          	const unsigned char *b = (const unsigned char *)d.bytes;
          	logf_(@"output size: %lu bytes", (unsigned long)d.length);
          	if (d.length >= 4) logf_(@"first bytes: %02x %02x %02x %02x (a 64-bit Mach-O starts cf fa ed fe)", b[0], b[1], b[2], b[3]);
          	logf_(@"=== PASS: compiled and linked on device ===");
          }

          @interface VC : UIViewController
          @end
          @implementation VC
          - (void)viewDidLoad {
          	[super viewDidLoad];
          	self.view.backgroundColor = UIColor.systemBackgroundColor;
          	UIButton *run = [UIButton buttonWithType:UIButtonTypeSystem];
          	[run setTitle:@"Run compile test" forState:UIControlStateNormal];
          	[run addTarget:self action:@selector(run) forControlEvents:UIControlEventTouchUpInside];
          	UIButton *copy = [UIButton buttonWithType:UIButtonTypeSystem];
          	[copy setTitle:@"Copy log" forState:UIControlStateNormal];
          	[copy addTarget:self action:@selector(copyLog) forControlEvents:UIControlEventTouchUpInside];
          	UIStackView *bar = [[UIStackView alloc] initWithArrangedSubviews:@[ run, copy ]];
          	bar.distribution = UIStackViewDistributionFillEqually;
          	gLog = [NSMutableString new];
          	gView = [UITextView new];
          	gView.editable = NO;
          	gView.font = [UIFont monospacedSystemFontOfSize:11 weight:UIFontWeightRegular];
          	bar.translatesAutoresizingMaskIntoConstraints = NO;
          	gView.translatesAutoresizingMaskIntoConstraints = NO;
          	[self.view addSubview:bar];
          	[self.view addSubview:gView];
          	UILayoutGuide *g = self.view.safeAreaLayoutGuide;
          	[NSLayoutConstraint activateConstraints:@[
          		[bar.topAnchor constraintEqualToAnchor:g.topAnchor],
          		[bar.leadingAnchor constraintEqualToAnchor:g.leadingAnchor],
          		[bar.trailingAnchor constraintEqualToAnchor:g.trailingAnchor],
          		[bar.heightAnchor constraintEqualToConstant:44],
          		[gView.topAnchor constraintEqualToAnchor:bar.bottomAnchor],
          		[gView.leadingAnchor constraintEqualToAnchor:g.leadingAnchor],
          		[gView.trailingAnchor constraintEqualToAnchor:g.trailingAnchor],
          		[gView.bottomAnchor constraintEqualToAnchor:g.bottomAnchor] ]];
          }
          - (void)run {
          	NSThread *t = [[NSThread alloc] initWithBlock:^{ runTest(); }];
          	t.stackSize = 8 * 1024 * 1024;  // clang is recursive; ioscc.h asks for 8 MB
          	[t start];
          }
          - (void)copyLog { UIPasteboard.generalPasteboard.string = gLog ?: @""; }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts {
          	self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
          	self.window.rootViewController = [VC new];
          	[self.window makeKeyAndVisible];
          	return YES;
          }
          @end

          int main(int argc, char *argv[]) {
          	@autoreleasepool {
          		return UIApplicationMain(argc, argv, nil, NSStringFromClass(AppDelegate.class));
          	}
          }
          EOF
          cat > "$P/ipa.conf" <<'EOF'
          NAME="IosccTest"
          BUNDLE_ID="com.example.iosccpest"
          VERSION="1.0"
          BUILD="1"
          MIN_IOS="15.0"
          FRAMEWORKS="Foundation UIKit"
          LIBS="c++ z"
          CFLAGS=""
          SWIFTFLAGS=""
          # libioscc.a plus every LLVM static library; Mach-O linking does not depend on archive order.
          LDFLAGS="-Wl,-dead_strip $PROJ/lib/libioscc.a $(ls "$PROJ"/lib/llvm/*.a | tr '\n' ' ')"
          ICON=""
          EXTRA_RES="toolchain"
          EOF
          ls -la "$P" "$P/src"

      - name: Build the test app
        working-directory: ${{ env.IPAB_HOME }}
        run: |
          ./ipab build IosccTest
          ls -lh IosccTest/build/

      - uses: actions/upload-artifact@v4
        with:
          name: IosccTest-ipa
          path: ${{ env.IPAB_HOME }}/IosccTest/build/IosccTest.ipa
          if-no-files-found: error
